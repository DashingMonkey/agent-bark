<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>agent-bark 悬浮窗</title>
    <script>
      /* 首帧定色：与 index.html / menu.html 内联脚本、src/theme.ts 同一套规则（改键名三处一起改） */
      (function () {
        try {
          var p = localStorage.getItem("agent-bark.theme");
          var t = p === "dark" || p === "light" ? p : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/src/widget.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="ctx-menu" role="menu">
      <button type="button" class="ctx-item" id="ctx-panel">打开主面板</button>
      <button type="button" class="ctx-item" id="ctx-pin">固定位置</button>
      <button type="button" class="ctx-item" id="ctx-undock" hidden>取消靠边隐藏</button>
      <div class="ctx-separator"></div>
      <button type="button" class="ctx-item" id="ctx-exit">关闭悬浮窗</button>
    </div>
    <script type="module" src="/src/widget.ts"></script>
  </body>
</html>
