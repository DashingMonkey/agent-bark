<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 文案（含 title）由 src/widget.ts 经 i18n 按 UI 语言填充；窗口先加载后显示，无闪烁 -->
    <title></title>
    <script>
      /* 首帧定色：与 index.html / menu.html 内联脚本、src/theme.ts 同一套规则（改键名三处一起改） */
      (function () {
        try {
          var p = localStorage.getItem("agent-bark.theme");
          var t = p === "dark" || p === "light" ? p : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/src/widget.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="ctx-menu" role="menu">
      <button type="button" class="ctx-item" id="ctx-panel"></button>
      <button type="button" class="ctx-item" id="ctx-pin"></button>
      <button type="button" class="ctx-item" id="ctx-tip"></button>
      <button type="button" class="ctx-item" id="ctx-undock" hidden></button>
      <div class="ctx-separator"></div>
      <button type="button" class="ctx-item" id="ctx-exit"></button>
    </div>
    <script type="module" src="/src/widget.ts"></script>
  </body>
</html>
