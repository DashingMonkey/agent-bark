<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>agent-bark 悬浮窗</title>
    <script>
      /* 首帧定色：与 index.html / menu.html 内联脚本、src/theme.ts 同一套规则（改键名三处一起改） */
      (function () {
        try {
          var p = localStorage.getItem("agent-bark.theme");
          var t = p === "dark" || p === "light" ? p : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
    <style>
      /*
        桌面悬浮窗（当前活动会话小卡片）。

        窗口是透明、无边框、置顶、不可聚焦的；页面只渲染一张圆角卡片，
        内容恒为固定宽（--card-w），窗口尺寸由 widget.ts 按内容高度跟随
        （行数变化时 setSize）。卡片不许有任何**画到圆角之外**的装饰
        （外阴影、外发光都不行）：窗口恰好是卡片大小，圆角外的像素会被
        窗口的矩形边界硬裁切，在桌面上留下一圈带直边的色块。

        颜色四态与主应用 --state-* / glow.rs 同一套（思考/等待/完成/失败）。
      */
      :root {
        /* 具体值由 <head> 里的内联脚本与 src/theme.ts 写到 data-theme 上 */
        color-scheme: dark;
        /* 首帧兜底宽度，widget.ts 会用注入参数覆盖 */
        --card-w: 240px;
      }
      :root[data-theme="light"] { color-scheme: light; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* 窗口透明：任何不透明背景都会在桌面上留一块色板 */
        background: transparent;
      }
      body {
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        user-select: none;
        cursor: default;
      }
      #app {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: flex-start;
        /* 自动隐藏的淡入 / 淡出（时长与 widget.ts 的 FADE_MS 一致，改一处一起改）：
           .fade = 透明，摘掉类即淡入；淡出完成后 widget.ts 才 win.hide() */
        transition: opacity 160ms ease;
      }
      #app.fade { opacity: 0; }

      .card {
        flex-shrink: 0;
        width: var(--card-w);
        padding: 5px 10px;
        border-radius: 10px;
        background: rgba(29, 29, 32, 0.92);
        border: 1px solid rgba(51, 51, 56, 0.95);
      }
      :root[data-theme="light"] .card {
        background: rgba(255, 255, 255, 0.94);
        border-color: rgba(213, 213, 220, 0.95);
      }

      .row-item {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 26px;
        padding: 0 2px;
      }
      /*
        子代理行：行首「↳」表达层级，名字压到 80% 亮度 + **小一号**（11px vs 12px），
        把视线让给父会话。左内边距由 widget.ts 内联给出（首级与父行的名字对齐）。

        为什么悬浮窗只用 ↳、**不加「子代理」徽标**：这一行已经被
        「图标 15px + 名字 + 状态」占满，再塞一个 chip（~34px）会让长名
        （DeepSeek Harness / Claude Code）被 ellipsis 吃掉——而「是哪个 agent」
        是这张卡片的第一信息。层级用记号表达不占宽度。
      */
      .row-item.sub .name {
        font-size: 11px;
        font-weight: 550;
        color: color-mix(in srgb, #e8e8ea 80%, transparent);
      }
      :root[data-theme="light"] .row-item.sub .name {
        color: color-mix(in srgb, #232327 80%, transparent);
      }
      /* ↳ 记号：负右边距吃掉行 gap，几乎不占宽度（卡片只有 240px 宽） */
      .tree {
        flex-shrink: 0;
        margin-right: -3px;
        font-size: 11px;
        line-height: 1;
        color: #9a9aa2;
      }
      /* 层级缩进由 widget.ts 内联给出（深度是数据、不是样式），这里只定每级步长 */
      /*
        孤儿行（父会话已结束 / 被摘档，快照里没有父行）：**顶格**显示 + 换成 ⇤ 记号。
        缩进会让人以为它属于上一行的子树——实测踩过：两个工作区各开一个 DSH 会话时，
        A 会话的子代理显示在 B 会话的子代理行下面，看起来就是「挂到了另一个会话」。
        记号保持中性灰（父回合正常结束不是错误，不该用告警色吓人）。
      */
      .row-item.orphan .tree { font-size: 10px; }
      .agent-icon { display: inline-flex; flex-shrink: 0; }
      .agent-icon svg { width: 15px; height: 15px; display: block; }
      .name {
        /* 主标签可以是项目名（有则用，见 widget.ts 的 rowLabel）：两种标签都可能较长，
           所以允许收缩 + 省略号——宁可截一点，也不要撑破 240px 的卡片 */
        flex: 0 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 12px;
        font-weight: 600;
        color: #e8e8ea;
        /* 把 state 推到行尾：名字列整体靠左，不随内容长度抖动 */
        margin-right: auto;
      }
      .state {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        white-space: nowrap;
      }
      .state .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      /* 四态配色：与主应用 --state-* / glow.rs GlowState::color 同源（Primer） */
      .state.thinking { color: #4493f8; } .state.thinking .dot { background: #4493f8; }
      .state.waiting { color: #f0883e; } .state.waiting .dot { background: #f0883e; }
      .state.completed { color: #3fb950; } .state.completed .dot { background: #3fb950; }
      .state.failed { color: #f85149; } .state.failed .dot { background: #f85149; }
      :root[data-theme="light"] .name { color: #232327; }
      :root[data-theme="light"] .state.thinking { color: #0969da; }
      :root[data-theme="light"] .state.thinking .dot { background: #0969da; }
      :root[data-theme="light"] .state.waiting { color: #bc4c00; }
      :root[data-theme="light"] .state.waiting .dot { background: #bc4c00; }
      :root[data-theme="light"] .state.completed { color: #1a7f37; }
      :root[data-theme="light"] .state.completed .dot { background: #1a7f37; }
      :root[data-theme="light"] .state.failed { color: #cf222e; }
      :root[data-theme="light"] .state.failed .dot { background: #cf222e; }

      /*
        行悬停提示（工作区名）：独立 DOM，不是卡片的子元素——窗口恰好是卡片大小，
        画在卡片内的提示会被窗口边界裁掉。样式对齐主面板的 .tooltip
        （style.css），但配色用卡片这套（widget.html 不引 style.css）。
      */
      #row-tip {
        position: fixed;
        z-index: 20;
        max-width: 228px;
        padding: 4px 8px;
        border-radius: 6px;
        background: rgba(29, 29, 32, 0.97);
        border: 1px solid rgba(51, 51, 56, 0.95);
        color: #e8e8ea;
        font-size: 11px;
        line-height: 1.5;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        pointer-events: none;
        opacity: 0;
        transition: opacity 100ms ease;
      }
      #row-tip.show { opacity: 1; }
      :root[data-theme="light"] #row-tip {
        background: rgba(255, 255, 255, 0.97);
        border-color: rgba(213, 213, 220, 0.95);
        color: #232327;
      }

      /*
        占位父行：快照里已经没有这个会话（回合结束 / 被判死淘汰），但它的子代理还在跑。
        合成一行给它兜住子代理，避免子代理平铺到列表末尾、贴在别的会话子树后面被误读成
        「挂到了那个会话下面」。没有图标、名字更暗、状态固定「已结束」。
      */
      .row-item.placeholder .name {
        font-weight: 500;
        color: #9a9aa2;
      }
      .row-item.placeholder .state { color: #9a9aa2; }
      .row-item.placeholder .state .dot { background: #6b6b74; }
      :root[data-theme="light"] .row-item.placeholder .name { color: #666670; }
      :root[data-theme="light"] .row-item.placeholder .state { color: #666670; }
      :root[data-theme="light"] .row-item.placeholder .state .dot { background: #9a9aa2; }

      .idle {
        color: #9a9aa2;
        font-size: 12px;
      }
      .idle img {
        width: 16px;
        height: 16px;
        border-radius: 4px;
        opacity: 0.85;
      }

      /*
        右键菜单（固定位置 / 关闭悬浮窗）：与卡片同一套面板样式。
        窗口比菜单小（卡片只有 38px 高），widget.ts 会在打开时把窗口
        临时撑到能容纳菜单、关闭时还原——菜单本体只管定位与展示。
      */
      #ctx-menu {
        position: fixed;
        z-index: 10;
        display: none;
        min-width: 132px;
        padding: 4px;
        border-radius: 8px;
        background: rgba(29, 29, 32, 0.97);
        border: 1px solid rgba(51, 51, 56, 0.95);
      }
      .ctx-item {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        padding: 6px 8px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: #e8e8ea;
        font-family: inherit;
        font-size: 12px;
        text-align: left;
        cursor: default;
      }
      .ctx-item:hover { background: rgba(255, 255, 255, 0.08); }
      /* 勾选列：两行菜单的对齐垫片，「固定位置」激活时显示 ✓ */
      .ctx-check { width: 13px; flex-shrink: 0; text-align: center; color: #4493f8; }
      .ctx-item.checked .ctx-check::before { content: "✓"; }
      :root[data-theme="light"] #ctx-menu {
        background: rgba(255, 255, 255, 0.97);
        border-color: rgba(213, 213, 220, 0.95);
      }
      :root[data-theme="light"] .ctx-item { color: #232327; }
      :root[data-theme="light"] .ctx-item:hover { background: rgba(0, 0, 0, 0.06); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ctx-menu">
      <button type="button" class="ctx-item" id="ctx-pin"><span class="ctx-check"></span>固定位置</button>
      <button type="button" class="ctx-item" id="ctx-exit"><span class="ctx-check"></span>关闭悬浮窗</button>
    </div>
    <script type="module" src="/src/widget.ts"></script>
  </body>
</html>
